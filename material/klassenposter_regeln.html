<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Klassenposter — Unsere Regeln</title>
<style>
  @page { size: A3 portrait; margin: 12mm; }
  * { box-sizing: border-box; }

  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    margin: 0; padding: 0; color: #111;
  }
  .sheet { width: 100%; }

  header { text-align: center; margin-bottom: 10mm; }
  .kicker {
    font-size: 13pt; letter-spacing: 3pt; text-transform: uppercase;
    color: #6b7280; font-weight: 600;
  }
  h1 {
    font-size: 52pt; margin: 2mm 0 0; letter-spacing: -1.5pt; line-height: 1;
  }
  .klasse {
    margin-top: 4mm; font-size: 14pt; color: #444;
  }
  .klasse span { border-bottom: 1.5pt solid #999; display: inline-block; min-width: 45mm; }

  /* --- Regelfelder --- */
  .regeln { display: flex; flex-direction: column; gap: 7mm; }

  .regel {
    display: flex; align-items: stretch;
    border: 2pt solid #111; border-radius: 3mm;
    min-height: 34mm; overflow: hidden;
  }
  .nr {
    width: 26mm; flex-shrink: 0;
    background: #111; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 40pt; font-weight: 700;
  }
  .feld {
    flex: 1; padding: 5mm 6mm;
    display: flex; flex-direction: column; justify-content: center;
    gap: 7mm;
  }
  .linie { border-bottom: 1pt solid #c8c8c8; height: 0; }

  /* --- Kernbotschaft --- */
  .kern {
    margin-top: 10mm;
    border: 3pt solid #111; border-radius: 3mm;
    padding: 7mm 8mm; text-align: center;
    background: #fffbeb;
  }
  .kern p { margin: 0; font-size: 22pt; font-weight: 700; line-height: 1.3; }
  .kern .klein { font-size: 13pt; font-weight: 400; margin-top: 3mm; color: #444; }

  /* --- Fußleiste --- */
  .fuss {
    margin-top: 8mm; display: flex; gap: 6mm;
  }
  .info {
    flex: 1; border: 1.5pt solid #999; border-radius: 2.5mm;
    padding: 4mm 5mm; text-align: center;
  }
  .info b { display: block; font-size: 11pt; color: #6b7280; letter-spacing: 1pt;
            text-transform: uppercase; margin-bottom: 2mm; }
  .info .wert { font-size: 26pt; font-weight: 700; }
  .info .wert.leer { border-bottom: 1.5pt solid #999; display: inline-block; min-width: 30mm; }

  @media screen {
    body { background: #ccc; padding: 15mm; }
    .sheet { background: #fff; padding: 15mm; box-shadow: 0 2px 16px rgba(0,0,0,.3); max-width: 297mm; margin: 0 auto; }
  }
  /* Hintergruende mitdrucken, ohne dass jemand die Checkbox im Druckdialog suchen muss */
  @media print { * { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
</style>
</head>
<body>
<div class="sheet">

  <header>
    <div class="kicker">KlasseKinderSpiel</div>
    <h1>Unsere Regeln</h1>
    <div class="klasse">Klasse <span></span></div>
  </header>

  <div class="regeln">
    <div class="regel">
      <div class="nr">1</div>
      <div class="feld"><div class="linie"></div><div class="linie"></div></div>
    </div>
    <div class="regel">
      <div class="nr">2</div>
      <div class="feld"><div class="linie"></div><div class="linie"></div></div>
    </div>
    <div class="regel">
      <div class="nr">3</div>
      <div class="feld"><div class="linie"></div><div class="linie"></div></div>
    </div>
    <div class="regel">
      <div class="nr">4</div>
      <div class="feld"><div class="linie"></div><div class="linie"></div></div>
    </div>
  </div>

  <div class="kern">
    <p>Alle Teams können gleichzeitig gewinnen.</p>
    <div class="klein">Wir spielen nicht gegeneinander &mdash; wir spielen gegen das Limit.</div>
  </div>

  <div class="fuss">
    <div class="info">
      <b>Foul-Limit</b>
      <div class="wert">4</div>
    </div>
    <div class="info">
      <b>Pro gewinnendes Team</b>
      <div class="wert">1 Min</div>
    </div>
    <div class="info">
      <b>Zeitsparer-Stand</b>
      <div class="wert leer">&nbsp;</div>
    </div>
  </div>

</div>

<!--
  HINWEIS FÜR DIE KLASSENLEITUNG

  Regeln gemeinsam mit der Klasse erarbeiten (Fahrplan, Woche 1 / Stunde 1).
  Zwei Bedingungen:
    - POSITIV formuliert  ("Wir arbeiten an unserer Aufgabe", nicht "Wir stören nicht")
    - BEOBACHTBAR         ("Wir hören zu, wenn jemand spricht", nicht "Wir sind nett")

  Eine Regel sollte das bisherige Zeitfresser-Verhalten abdecken, z.B. "Wir fangen sofort an."

  Bewährte Formulierungen, falls die Klasse hängt:
    - Wir arbeiten an unserer Aufgabe.
    - Wir fangen sofort an.
    - Wir hören zu, wenn jemand spricht.
    - Wir bleiben an unserem Platz.

  Die Regeln von den Kindern selbst eintragen lassen - dicke Filzstifte, gut lesbar.
  KEINE Namen auf dieses Poster.
-->
</body>
</html>
